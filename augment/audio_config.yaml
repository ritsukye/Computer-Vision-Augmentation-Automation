seed: 42
deterministic: true

# level augmentations
# =============================================
levels:
  gain_shift:
    enabled: true
    limit: 6  # +/- dB

  normalization:
    enabled: true  # peak-normalize so the loudest sample sits at 0 dBFS

  clipping:
    enabled: true
    min_percentile: 0
    max_percentile: 40

# noise augmentations
# =============================================
noise:
  white_noise:
    enabled: true
    min_amplitude: 0.001
    max_amplitude: 0.02

  pink_noise:
    enabled: true
    min_snr_db: 5
    max_snr_db: 40

  brown_noise:
    enabled: true
    min_snr_db: 5
    max_snr_db: 40

# temporal augmentations
# =============================================
temporal:
  time_stretch:
    enabled: true
    min_rate: 0.9
    max_rate: 1.1

  time_shift:
    enabled: true
    max_fraction: 0.1

# spectral augmentations
# =============================================
spectral:
  pitch_shift:
    enabled: true
    semitones: 2

  eq_filtering:
    enabled: true
    gain_db: 12  # each of 7 bands gets a random gain within +/- this

  bandstop_filter:
    enabled: true
    min_center_hz: 200
    max_center_hz: 4000

# codec augmentations
# =============================================
codec:
  mp3_compress:
    enabled: true
    min_bitrate: 16  # kbps
    max_bitrate: 64
